name: Woven verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff bandit pip-audit
      - run: pytest -q
        working-directory: backend
      - run: ruff check app tests
        working-directory: backend
      - run: bandit -q -r app -x tests
        working-directory: backend
      - run: pip-audit -r requirements.txt
        working-directory: backend

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: woven
          POSTGRES_USER: woven
          POSTGRES_PASSWORD: woven-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U woven -d woven"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: staging
      DEBUG: "false"
      PUBLIC_BASE_URL: https://api.staging.example.invalid
      DATABASE_URL: postgresql+psycopg2://woven:woven-ci-only@127.0.0.1:5432/woven
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      REFRESH_TOKEN_PEPPER: ci-only-refresh-pepper-with-at-least-32-characters
      APPLE_CLIENT_ID: com.example.Woven
      TRUSTED_HOSTS: api.staging.example.invalid
      STORAGE_BACKEND: object
      OBJECT_STORAGE_ENDPOINT: https://objects.example.invalid
      OBJECT_STORAGE_BUCKET: ci-ciphertext
      OBJECT_STORAGE_ACCESS_KEY: ci-only
      OBJECT_STORAGE_SECRET_KEY: ci-only-not-a-real-secret
      ENFORCE_DEVICE_SIGNATURES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: alembic downgrade -1 && alembic upgrade head
        working-directory: backend
      - run: alembic check
        working-directory: backend
      - run: python scripts/validate_staging_config.py
        working-directory: backend

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: >-
          xcodebuild test -project Woven.xcodeproj -scheme Woven
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
      - run: >-
          xcodebuild analyze -project Woven.xcodeproj -scheme Woven
          -configuration Release -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - run: >-
          xcodebuild build -project Woven.xcodeproj -scheme Woven-Staging
          -configuration Staging -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          WOVEN_STAGING_API_BASE_URL=https://api.staging.example.invalid
          WOVEN_STAGING_BUNDLE_IDENTIFIER=com.example.Woven.staging
          WOVEN_STAGING_DEVELOPMENT_TEAM=
